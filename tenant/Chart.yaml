apiVersion: v2
name: openclaw-on-openshift-tenant
description: >-
  Tenant half of the OpenClaw-on-OpenShift demo: ONE OpenClaw seat --
  the Claw instance, its FantaCo MCP servers, its MaaS key, its audience
  Route and its in-pod setup -- in a single namespace. Deployed once per
  tenant order onto a cluster already carrying the cluster chart.
